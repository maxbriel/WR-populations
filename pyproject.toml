[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wr_population"
version = "0.1.0"
description = "Helper functions for the WR population study with POSYDON"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "cmap", "posydon"]

[tool.setuptools]
packages = ["wr_population"]
